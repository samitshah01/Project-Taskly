{% extends 'components/base.html' %}

{% block title %}Set New Password - Taskly{% endblock %}

{% block content %}
<div class="reset-paw-page">
    <div class="reset-paw-card">
        <div class="reset-paw-header">
            <div class="reset-paw-header-icon">
                <i class="bi bi-shield-lock" style="font-size:36px; color:var(--accent);"></i>
            </div>
            <h1 class="reset-paw-title">Set New Password</h1>
            <p class="reset-paw-sub">Choose a strong password for your account.</p>
        </div>

        <form method="POST" action="" novalidate>
            {% csrf_token %}

            <div class="reset-paw-field">
                <label class="reset-paw-label" for="new_password1">New Password</label>
                <div class="reset-paw-input-wrap" data-wrap>
                    <i class="bi bi-lock reset-paw-input-icon"></i>
                    <input type="password" id="new_password1" name="new_password1" class="reset-paw-input has-toggle"
                        placeholder="New password" required oninput="checkStrength(this.value)">
                    <button type="button" class="reset-paw-pw-toggle" data-target="new_password1" tabindex="-1">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="reset-paw-strength" id="strengthMeter" style="display:none;">
                    <div class="reset-paw-strength-bars">
                        <div class="reset-paw-strength-bar" id="sb1"></div>
                        <div class="reset-paw-strength-bar" id="sb2"></div>
                        <div class="reset-paw-strength-bar" id="sb3"></div>
                        <div class="reset-paw-strength-bar" id="sb4"></div>
                    </div>
                    <span class="reset-paw-strength-label" id="strengthLabel"></span>
                </div>
            </div>

            <div class="reset-paw-field">
                <label class="reset-paw-label" for="new_password2">Confirm Password</label>
                <div class="reset-paw-input-wrap" data-wrap>
                    <i class="bi bi-lock-fill reset-paw-input-icon"></i>
                    <input type="password" id="new_password2" name="new_password2" class="reset-paw-input has-toggle"
                        placeholder="Confirm password" required>
                    <button type="button" class="reset-paw-pw-toggle" data-target="new_password2" tabindex="-1">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="reset-paw-submit">Set Password <i class="bi bi-arrow-right"></i></button>
        </form>
    </div>
</div>

<script>
    document.querySelectorAll('.reset-paw-input').forEach(input => {
        input.addEventListener('focus', () => input.closest('[data-wrap]').classList.add('focused'));
        input.addEventListener('blur', () => input.closest('[data-wrap]').classList.remove('focused'));
    });

    document.querySelectorAll('.reset-paw-pw-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const input = document.getElementById(btn.dataset.target);
            const icon = btn.querySelector('i');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    });

    function checkStrength(val) {
        const meter = document.getElementById('strengthMeter');
        const label = document.getElementById('strengthLabel');
        const bars = [document.getElementById('sb1'), document.getElementById('sb2'), document.getElementById('sb3'), document.getElementById('sb4')];
        if (!val) { meter.style.display = 'none'; return; }
        meter.style.display = 'flex';
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const levels = [{ label: 'Weak', color: '#ff5470' }, { label: 'Fair', color: '#ffb547' }, { label: 'Good', color: '#4f7cff' }, { label: 'Strong', color: '#30d87d' }];
        const cls = ['active-weak', 'active-fair', 'active-good', 'active-strong'];
        bars.forEach((bar, i) => { bar.className = 'reset-paw-strength-bar'; if (i < score) bar.classList.add(cls[score - 1]); });
        label.textContent = levels[score - 1]?.label || '';
        label.style.color = levels[score - 1]?.color || 'transparent';
    }
</script>
{% endblock %}
