{% extends 'components/base.html' %}

{% block title %}Register - Taskly{% endblock %}

{% block content %}
<div class="reg-page">
    <div class="reg-card">
        <div class="reg-header">
            <h1 class="reg-title">Create your account</h1>
            <p class="reg-sub">Start managing projects with your team.</p>
        </div>

        <form method="POST" action="{% url 'register' %}" novalidate>
            {% csrf_token %}

            <div class="reg-row">
                <div class="reg-field">
                    <label class="reg-label" for="first_name">First name</label>
                    <div class="reg-input-wrap" data-wrap>
                        <i class="bi bi-person reg-input-icon"></i>
                        <input type="text" id="first_name" name="first_name" class="reg-input" placeholder="John" autocomplete="given-name" required />
                    </div>
                </div>
                <div class="reg-field">
                    <label class="reg-label" for="last_name">Last name</label>
                    <div class="reg-input-wrap" data-wrap>
                        <i class="bi bi-person reg-input-icon"></i>
                        <input type="text" id="last_name" name="last_name" class="reg-input" placeholder="Doe" autocomplete="family-name" required />
                    </div>
                </div>
            </div>

            <div class="reg-field">
                <label class="reg-label" for="username">Username</label>
                <div class="reg-input-wrap" data-wrap>
                    <i class="bi bi-at reg-input-icon"></i>
                    <input type="text" id="username" name="username" class="reg-input" placeholder="johndoe" autocomplete="username" required />
                </div>
                <div id="usernameFeedback" class="username-feedback">
                    <i></i>
                    <span></span>
                </div>
            </div>

            <div class="reg-field">
                <label class="reg-label" for="email">Email address</label>
                <div class="reg-input-wrap" data-wrap>
                    <i class="bi bi-envelope reg-input-icon"></i>
                    <input type="email" id="email" name="email" class="reg-input" placeholder="john@company.com" autocomplete="email" required />
                </div>
            </div>

            <div class="reg-field">
                <label class="reg-label" for="password1">Password</label>
                <div class="reg-input-wrap" data-wrap>
                    <i class="bi bi-lock reg-input-icon"></i>
                    <input type="password" id="password1" name="password1" class="reg-input has-toggle" placeholder="Create a strong password" autocomplete="new-password" required oninput="checkStrength(this.value)" />
                    <button type="button" class="reg-pw-toggle" data-target="password1" tabindex="-1">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="reg-strength" id="strengthMeter" style="display:none;">
                    <div class="reg-strength-bars">
                        <div class="reg-strength-bar" id="sb1"></div>
                        <div class="reg-strength-bar" id="sb2"></div>
                        <div class="reg-strength-bar" id="sb3"></div>
                        <div class="reg-strength-bar" id="sb4"></div>
                    </div>
                    <span class="reg-strength-label" id="strengthLabel"></span>
                </div>
            </div>

            <div class="reg-field">
                <label class="reg-label" for="password2">Confirm password</label>
                <div class="reg-input-wrap" data-wrap>
                    <i class="bi bi-lock-fill reg-input-icon"></i>
                    <input type="password" id="password2" name="password2" class="reg-input has-toggle"
                        placeholder="Repeat your password" autocomplete="new-password" required />
                    <button type="button" class="reg-pw-toggle" data-target="password2" tabindex="-1">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="reg-terms">
                <label class="reg-check-label">
                    <input type="checkbox" name="terms" class="reg-check" id="terms" required />
                    <span class="reg-check-box"></span>
                    I agree to Taskly's<a href="#" data-bs-toggle="modal" data-bs-target="#legalModal" onclick="setLegalTab('tos')">Terms of Service</a>and<a href="#" data-bs-toggle="modal" data-bs-target="#legalModal" onclick="setLegalTab('privacy')">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="reg-submit">
                Create Account <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <p class="reg-switch">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
