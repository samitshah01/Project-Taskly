<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ email_headline|default:"Your OTP Code" }}</title>
</head>

<body style="margin:0; padding:0; background-color:#0d0f14; font-family:Arial,sans-serif; color:#ffffff;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0; background-color:#0d0f14;">
        <tr>
            <td align="center">
                <table width="400" cellpadding="0" cellspacing="0"
                    style="background-color:#161920; border-radius:14px; padding:30px; box-shadow:0 8px 32px rgba(0,0,0,0.3);">
                    <tr>
                        <td align="center" style="padding-bottom:20px;">
                            <h1 style="margin:0; font-size:24px; font-weight:700; color:#4f7cff;">Taskly OTP
                                {{ email_headline|default:"Verification" }}</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-bottom:20px; font-size:16px; line-height:1.5; color:#cfd3db;">
                            Hi there,
                            <br><br>
                            {{ email_message|default:"Use the following one-time password (OTP)." }} This OTP is valid for
                            <strong style="color:#4f7cff;">10 minutes</strong>.
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-bottom:20px;">
                            <span style=" display:inline-block; font-size:28px; font-weight:800; color:#ffffff; background-color:#4f7cff; padding:10px 30px; border-radius:10px; letter-spacing:4px;">{{ otp }}</span>
                        </td>
                    </tr>

                    <tr>
                        <td style="font-size:14px; line-height:1.4; color:#6b7599; text-align:center;">
                            If you did not request this OTP, please ignore this email.
                            <br><br>
                            &copy; 2026 Taskly
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
