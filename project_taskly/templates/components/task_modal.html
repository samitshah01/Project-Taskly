<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{% url 'create_task' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}">

        <div class="modal-header">
          <h5 class="modal-title" id="addTaskModalLabel">Create New Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          {% if task_project_options %}
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div>
              <label class="form-label">Task Title</label>
              <input type="text" class="form-control" name="title" placeholder="Enter task title" required />
            </div>

            <div>
              <label class="form-label">Description</label>
              <textarea class="form-control" name="description" rows="3" placeholder="Describe the task" style="resize:none;"></textarea>
            </div>

            <div class="row g-3">
              <div class="col-6">
                <label class="form-label">Project</label>
                <select class="form-select" name="project" required>
                  <option value="">Select project</option>
                  {% for project in task_project_options %}
                    <option value="{{ project.id }}">{{ project.name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-6">
                <label class="form-label">Priority</label>
                <select class="form-select" name="priority">
                  <option value="high">High</option>
                  <option value="medium" selected>Medium</option>
                  <option value="low">Low</option>
                </select>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-6">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                  <option value="todo" selected>To Do</option>
                  <option value="in_progress">In Progress</option>
                  <option value="completed">Completed</option>
                </select>
              </div>

              <div class="col-6">
                <label class="form-label">Due Date</label>
                <input type="date" class="form-control" name="due_date" />
              </div>
            </div>

            <div>
              <label class="form-label">Assign To</label>
              <select class="form-select" name="assigned_to" id="taskAssigneeSelect">
                <option value="">Assign to me</option>
              </select>
            </div>
          </div>
          {% else %}
          <p style="margin:0;color:var(--muted);font-size:13px;">You can create tasks only in projects where you are the Project Manager.</p>
          {% endif %}
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-primary-custom" {% if not task_project_options %}disabled{% endif %}>Create Task</button>
        </div>
      </form>
    </div>
  </div>
</div>
{{ task_project_member_map|json_script:"task-project-member-map" }}
