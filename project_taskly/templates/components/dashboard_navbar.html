{% load static %}

<aside class="sidebar" id="sidebar">
    <a href="{% url 'index' %}" class="sidebar-logo" aria-label="Go to Taskly homepage">
        <span class="logo-icon"><img src="{% static 'images/logo/logo.png' %}" alt="Taskly Logo"></span>
        <span class="sidebar-logo-text">Taskly</span>
    </a>

    <div class="sidebar-section">
        <div class="sidebar-label">Main Menu</div>
        <a href="{% url 'dashboard' %}" class="nav-item-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"><i class="bi bi-grid-1x2"></i>Dashboard</a>
        <a href="{% url 'projects' %}" class="nav-item-link {% if request.resolver_match.url_name == 'projects' %}active{% endif %}"><i class="bi bi-folder2"></i> Projects <span class="nav-badge">{{ sidebar_project_count }}</span></a>
        <a href="{% url 'tasks' %}" class="nav-item-link {% if request.resolver_match.url_name == 'tasks' %}active{% endif %}"><i class="bi bi-check2-circle"></i> My Tasks <span class="nav-badge">{{ sidebar_task_count }}</span></a>
        <a href="{% url 'calendar' %}" class="nav-item-link {% if request.resolver_match.url_name == 'calendar' %}active{% endif %}"><i class="bi bi-calendar3"></i> Calendar</a>
        <a href="{{ finance_nav_url }}" class="nav-item-link {% if request.resolver_match.url_name == 'budget_tracking' or request.resolver_match.url_name == 'project_budget' %}active{% endif %}"><i class="bi bi-wallet2"></i> Budget</a>
        <a href="{% url 'income_visualization' %}" class="nav-item-link {% if request.resolver_match.url_name == 'income_visualization' %}active{% endif %}"><i class="bi bi-graph-up-arrow"></i> Income</a>
        <a href="{% url 'employees' %}" class="nav-item-link {% if request.resolver_match.url_name == 'employees' %}active{% endif %}"><i class="bi bi-people"></i> Employees</a>
        <a href="{% url 'users' %}" class="nav-item-link {% if request.resolver_match.url_name == 'users' %}active{% endif %}"><i class="bi bi-person-lines-fill"></i> Users</a>
    </div>

    <div class="sidebar-section">
        <div class="sidebar-label">Account</div>
        <a href="{% url 'settings' %}" class="nav-item-link {% if request.resolver_match.url_name == 'settings' %}active{% endif %}"><i class="bi bi-sliders"></i> Settings</a>
    </div>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
